<div>
    <div
        class="flex items-center
            justify-between gap-4 mb-6"
    >
        <div>
            <h1
                class="text-2xl font-display
                    font-bold mb-1"
            >Flows</h1>
            <p class="text-muted">
                Visual state machine flows
                for your projects
            </p>
        </div>
        <button
            class="btn btn-primary btn-sm"
            id="import-flow-btn"
        >Import Flow</button>
        <input
            type="file"
            id="import-flow-input"
            accept=".mmd,.zip"
            class="hidden"
        >
    </div>

    <div
        class="dialog-backdrop hidden"
        id="import-flow-backdrop"
    >
        <div
            class="dialog hidden"
            id="import-flow-dialog"
            aria-hidden="true"
            style="max-width:28rem"
        >
            <div style="padding:1.5rem;
                border-bottom:1px solid
                hsl(var(--border))"
            >
                <h3
                    class="text-lg
                        font-display
                        font-semibold"
                >Import Flow</h3>
                <p
                    class="text-sm
                        text-muted"
                >Select a project and
                    choose a .mmd or
                    .zip file</p>
            </div>
            <div
                style="padding:1.5rem;
                    display:flex;
                    flex-direction:column;
                    gap:1rem"
            >
                <div>
                    <label
                        class="label"
                        for="import-project"
                    >Project</label>
                    <select
                        id="import-project"
                        class="input w-full"
                    ></select>
                </div>
                <div
                    class="flex gap-2
                        justify-end"
                >
                    <button
                        class="btn
                            btn-ghost
                            btn-sm"
                        id="import-cancel"
                    >Cancel</button>
                    <button
                        class="btn
                            btn-primary
                            btn-sm"
                        id="import-choose"
                    >Choose File</button>
                </div>
            </div>
        </div>
    </div>

    <div
        id="flow-list"
        class="flex flex-col gap-3"
    >
    </div>
</div>
