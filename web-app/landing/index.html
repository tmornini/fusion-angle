<!DOCTYPE html>
<html lang="en" data-page="landing">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        />
        <title>Fusion AI — Human-Intelligence First</title>
        <meta
            name="description"
            content="Fusion AI - Human-Intelligence
                first AI platform."
        />
        <link
            rel="stylesheet"
            href="../assets/styles.css"
        />
        <link
            rel="icon"
            href="../assets/favicon.ico"
            sizes="any"
        />
        <script>
            (function() {
                var t = localStorage
                    .getItem('fusion-theme');
                var dark = t === 'dark'
                    || (t !== 'light'
                        && matchMedia(
                            '(prefers-color-scheme'
                            + ': dark)'
                        ).matches);
                if (dark) {
                    var d = document
                        .documentElement;
                    d.setAttribute(
                        'data-theme', 'dark'
                    );
                    d.classList.add('dark');
                }
            })();
        </script>
    </head>
    <body>
        <div id="page-root"></div>
        <script src="../assets/app.js"></script>
    </body>
</html>
