            <!-- ===== DESKTOP SIDEBAR ===== -->
            <aside
                class="sidebar"
                id="desktop-sidebar"
            >
                <div class="sidebar-header">
                    <button
                        type="button"
                        class="sidebar-logo"
                        id="sidebar-toggle"
                        aria-label="Toggle sidebar"
                        title="Toggle sidebar"
                    >
                        <div
                            class="sidebar-logo-icon"
                        ><img
                            src="../assets/mark.png"
                            width="28"
                            height="28"
                            class="brand-mark"
                            alt=""
                        /></div>
                        <span
                            class="sidebar-logo-text"

                    </button>
                </div>
                <nav class="sidebar-nav">
                    {{SIDEBAR_NAV_ITEMS}}

                <div class="sidebar-footer">
                    <div class="sidebar-member">
                        <div
                            class="sidebar-avatar"
                        ><svg
                            xmlns="http://www.w3.org/2000/svg"

                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        ><path
                            d="M19 21v-2a4

                            cx="12" cy="7"
                            r="4"

                        <div class="flex-fill">
                            <p
                                class="text-sm
                                    font-medium
                                    truncate"
                                id="sidebar-member-name"
                            ></p>
                        </div>
                    </div>
                </div>
            </aside>
