<!DOCTYPE html>
<html lang="en" data-page="{{PAGE_NAME}}">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        />
        <title>{{PAGE_TITLE}} | Fusion Angle</title>
        <meta
            name="description"
            content="Fusion Angle - Human-Intelligence
                first AI platform."
        />
        <link
            rel="stylesheet"
            href="../assets/styles.css"
        />
        {{PAGE_CSS_LINKS}}
        <link
            rel="icon"
            type="image/svg+xml"
            href="../assets/favicon.svg"
        />
        <link
            rel="icon"
            href="../assets/favicon.ico"
            sizes="any"
        />
        <meta
            http-equiv="Content-Security-Policy"
            content="
                default-src 'self';
                script-src 'self';
                style-src 'self';
                style-src-attr 'unsafe-inline';
                font-src 'self';
                img-src 'self' data:;
                frame-ancestors 'none';
                base-uri 'self';
                form-action 'self'
            "
        />
        <script src="../assets/theme-init.js"></script>
    </head>
    <body>
        <a class="skip-link" href="#main-content"
            >Skip to main content</a>
        <div class="sidebar-layout">

            {{COMPONENT_SIDEBAR}}

            <div class="main-content">
                {{COMPONENT_TOP_BAR}}

                {{COMPONENT_MOBILE_HEADER}}

                {{COMPONENT_MOBILE_SIDEBAR}}

                <!-- ===== PAGE CONTENT ===== -->
                <main class="page-content"
                    id="main-content" tabindex="-1">
                    {{PAGE_CONTENT}}
                </main>
            </div>

        </div>

        <div
            id="toast-container"
            aria-live="polite"
            aria-atomic="true"
        ></div>
        <script src="../assets/app.js"></script>
    </body>
</html>
