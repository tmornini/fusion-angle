<!DOCTYPE html>
<html lang="en" data-page="{{PAGE_NAME}}">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        />
        <title>{{PAGE_TITLE}} | Fusion AI</title>
        <meta
            name="description"
            content="Fusion AI - Human-Intelligence
                first AI platform."
        />
        <link
            rel="stylesheet"
            href="../assets/styles.css"
        />
        <link
            rel="icon"
            href="../assets/favicon.ico"
            sizes="any"
        />
        <script>
            (function() {
                var t = localStorage
                    .getItem('fusion-theme');
                var dark = t === 'dark'
                    || (t !== 'light'
                        && matchMedia(
                            '(prefers-color-scheme'
                            + ': dark)'
                        ).matches);
                if (dark) {
                    var d = document
                        .documentElement;
                    d.setAttribute(
                        'data-theme', 'dark'
                    );
                    d.classList.add('dark');
                }
            })();
        </script>
        <script>
            (function() {
                var v = localStorage
                    .getItem(
                        'fusion-sidebar-collapsed'
                    );
                if (v === 'true') {
                    document.documentElement
                        .classList.add(
                            'sidebar-collapsed'
                        );
                }
            })();
        </script>
    </head>
    <body>
        <div class="sidebar-layout">

            <!-- COMPONENT_SIDEBAR -->

            <div class="main-content">
                <!-- COMPONENT_TOP_BAR -->

                <!-- COMPONENT_MOBILE_HEADER -->

                <!-- COMPONENT_MOBILE_SIDEBAR -->

                <!-- ===== PAGE CONTENT ===== -->
                <div class="page-content">
                    <!-- PAGE_CONTENT -->
                </div>
            </div>

        </div>

        <div
            id="toast-container"
            aria-live="polite"
            aria-atomic="true"
        ></div>
        <script src="../assets/app.js"></script>
    </body>
</html>
