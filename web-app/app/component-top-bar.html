                <header class="top-header">
                    <div class="search-wrapper">
                        <span
                            class="search-icon"
                        ><svg
                            xmlns="http://www.w3.org/2000/svg"
                            width="16"
                            height="16"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        ><circle
                            cx="11" cy="11" r="8"
                        /><path
                            d="m21 21-4.3-4.3"
                        /></svg></span>
                        <input
                            type="text"
                            class="input
                                search-input"
                            placeholder="Search
                                ideas, projects,
                                members..."
                            id="search-input"
                            aria-label="Search
                                ideas, projects,
                                members"
                        />
                    </div>
                    <div
                        class="header-info
                            hidden-mobile"
                        id="header-stats"
                    ></div>
                    <div class="header-actions">
                        <!-- Pending invitations: shown
                             only when one or more are
                             pending (an honest
                             affordance). -->
                        <button
                            type="button"
                            class="btn btn-ghost
                                btn-icon
                                icon-badge-host hidden"
                            id="invitations-bell"
                            aria-label="View
                                invitations"
                        ><svg
                            xmlns="http://www.w3.org/2000/svg"
                            width="20"
                            height="20"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        ><path
                            d="M6 8a6 6 0 0 1 12 0c0
                                7 3 9 3 9H3s3-2 3-9"
                        /><path
                            d="M10.3 21a1.94 1.94 0 0
                                0 3.4 0"
                        /></svg><span
                            class="icon-count-badge"
                            id="invitations-badge"
                        ></span></button>
                        <!-- Theme Toggle -->
                        <div class="dropdown">
                            <button
                                class="btn btn-ghost
                                    btn-icon"
                                id="theme-toggle"
                                aria-label="Toggle
                                    theme"
                            ><svg
                                xmlns="http://www.w3.org/2000/svg"
                                width="20"
                                height="20"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            ><rect
                                width="20"
                                height="14"
                                x="2" y="3" rx="2"
                            /><line
                                x1="8" x2="16"
                                y1="21" y2="21"
                            /><line
                                x1="12" x2="12"
                                y1="17" y2="21"
                            /></svg></button>
                            <div
                                class="dropdown-content
                                    hidden"
                                id="theme-dropdown"
                                data-align="end"
                            >
                                <button
                                    class="dropdown-item"
                                    data-theme-set="light"
                                ><svg
                                    xmlns="http://www.w3.org/2000/svg"
                                    width="16"
                                    height="16"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                ><circle
                                    cx="12"
                                    cy="12"
                                    r="4"
                                /><path
                                    d="M12 2v2"
                                /><path
                                    d="M12 20v2"
                                /><path
                                    d="m4.93 4.93
                                        1.41 1.41"
                                /><path
                                    d="m17.66 17.66
                                        1.41 1.41"
                                /><path
                                    d="M2 12h2"
                                /><path
                                    d="M20 12h2"
                                /><path
                                    d="m6.34 17.66
                                        -1.41 1.41"
                                /><path
                                    d="m19.07 4.93
                                        -1.41 1.41"
                                /></svg> Light</button>
                                <button
                                    class="dropdown-item"
                                    data-theme-set="dark"
                                ><svg
                                    xmlns="http://www.w3.org/2000/svg"
                                    width="16"
                                    height="16"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                ><path
                                    d="M12 3a6 6 0 0 0
                                        9 9 9 9 0 1
                                        1-9-9Z"
                                /></svg> Dark</button>
                                <button
                                    class="dropdown-item"
                                    data-theme-set="system"
                                ><svg
                                    xmlns="http://www.w3.org/2000/svg"
                                    width="16"
                                    height="16"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                ><rect
                                    width="20"
                                    height="14"
                                    x="2" y="3"
                                    rx="2"
                                /><line
                                    x1="8" x2="16"
                                    y1="21" y2="21"
                                /><line
                                    x1="12" x2="12"
                                    y1="17" y2="21"
                                /></svg> System</button>
                            </div>
                        </div>
                    </div>
                </header>
