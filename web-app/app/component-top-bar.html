                <header class="top-header">
                    <div class="search-wrapper">
                        <span
                            class="search-icon"
                        ><svg
                            xmlns="http://www.w3.org/2000/svg"
                            width="16"
                            height="16"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        ><circle
                            cx="11" cy="11" r="8"
                        /><path
                            d="m21 21-4.3-4.3"
                        /></svg></span>
                        <input
                            type="text"
                            class="input
                                search-input"
                            placeholder="Search
                                ideas, projects,
                                members..."
                            id="search-input"
                            aria-label="Search
                                ideas, projects,
                                members"
                        />
                    </div>
                    <div
                        class="header-info
                            hidden-mobile"
                        id="header-stats"
                    ></div>
                    <div class="header-actions">
                        <!-- Pending invitations: shown
                             only when one or more are
                             pending (an honest
                             affordance). -->
                        <button
                            type="button"
                            class="btn btn-ghost
                                btn-icon
                                icon-badge-host hidden"
                            id="invitations-bell"
                            aria-label="View
                                invitations"
                        ><svg
                            xmlns="http://www.w3.org/2000/svg"
                            width="20"
                            height="20"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        ><path
                            d="M6 8a6 6 0 0 1 12 0c0
                                7 3 9 3 9H3s3-2 3-9"
                        /><path
                            d="M10.3 21a1.94 1.94 0 0
                                0 3.4 0"
                        /></svg><span
                            class="icon-count-badge"
                            id="invitations-badge"
                        ></span></button>
                    </div>
                </header>
