<div id="organization-content">
</div>

<!-- Sent invitations: outstanding (pending) invitations this
     org has sent, with a Revoke per row. Admin-only; hidden
     until the admin read succeeds. -->
<div id="sent-invitations-box" class="mt-6 hidden">
    <h2 class="text-lg font-semibold mb-3">
        Sent invitations
    </h2>
    <div id="sent-invitations-list"
        class="flex flex-col gap-3"></div>
</div>

<dialog id="add-objective-dialog"
    class="dialog dialog-narrow"
    role="dialog"
    aria-labelledby="add-objective-title">
    <div class="dialog-header">
        <h3 id="add-objective-title"
            class="dialog-title">Add objective</h3>
    </div>
    <div class="mb-3">
        <label class="label mb-1"
            for="add-obj-name">Name</label>
        <input id="add-obj-name" type="text"
            class="input w-full">
    </div>
    <div>
        <label class="label mb-1"
            for="add-obj-description">Description</label>
        <textarea id="add-obj-description"
            class="input w-full" rows="3"></textarea>
    </div>
    <div class="dialog-footer">
        <button class="btn btn-outline"
            data-action="cancel-add-objective">
            Cancel
        </button>
        <button class="btn btn-primary"
            data-action="confirm-add-objective">
            Add
        </button>
    </div>
</dialog>

<dialog id="edit-objective-dialog"
    class="dialog dialog-narrow"
    role="dialog"
    aria-labelledby="edit-objective-title">
    <div class="dialog-header">
        <h3 id="edit-objective-title"
            class="dialog-title">Edit objective</h3>
    </div>
    <input id="edit-obj-id" type="hidden">
    <div class="mb-3">
        <label class="label mb-1"
            for="edit-obj-name">Name</label>
        <input id="edit-obj-name" type="text"
            class="input w-full">
    </div>
    <div>
        <label class="label mb-1"
            for="edit-obj-description">Description</label>
        <textarea id="edit-obj-description"
            class="input w-full" rows="3"></textarea>
    </div>
    <div class="dialog-footer">
        <button class="btn btn-outline"
            data-action="cancel-edit-objective">
            Cancel
        </button>
        <button class="btn btn-primary"
            data-action="confirm-edit-objective">
            Save
        </button>
    </div>
</dialog>

<dialog id="confirm-archive-dialog"
    class="dialog dialog-narrow"
    role="alertdialog"
    aria-labelledby="confirm-archive-title"
    aria-describedby="confirm-archive-message">
    <div class="dialog-header">
        <h3 id="confirm-archive-title"
            class="dialog-title">Archive objective?</h3>
    </div>
    <input id="confirm-archive-id" type="hidden">
    <p id="confirm-archive-message"
        class="text-sm text-muted">
        The objective stops appearing in active
        rosters but its historical scores remain
        visible.
    </p>
    <div class="dialog-footer">
        <button class="btn btn-outline"
            data-action="cancel-confirm-archive">
            Cancel
        </button>
        <button class="btn btn-primary"
            data-action="confirm-archive">
            Archive
        </button>
    </div>
</dialog>
