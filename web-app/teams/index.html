<div>
    <div class="page-header">
        <div>
            <h1 class="page-title">Teams</h1>
            <p
                class="text-sm text-muted"
                id="team-summary"
            ></p>
        </div>
        <div class="flex items-center gap-2">
            <a
                class="btn btn-outline gap-2"
                href="../organization/activity-feed.html"
            ><span
                id="activity-feed-btn-icon"
            ></span> <span
                class="hidden-mobile"
            >Activity Feed</span></a>
            <button
                class="btn btn-primary gap-2"
                id="team-add-btn"
            ><span
                id="add-member-btn-icon"
            ></span> <span
                class="hidden-mobile"
            >Add Member</span><span
                class="visible-mobile"
            >Add</span></button>
        </div>
    </div>

    <div class="flex items-center gap-4 mb-6">
        <div
            class="search-wrapper flex-1"
            style="max-width:28rem"
        >
            <span
                class="search-icon"
                id="search-field-icon"
            ></span>
            <input
                class="input search-input"
                placeholder="Search by
                    name, role..."
                id="team-search"
                aria-label="Search by
                    name or role"
            />
        </div>
    </div>

    <div class="detail-grid">
        <div
            id="team-list"
            class="flex flex-col gap-3"
        >
        </div>
        <div
            id="team-detail-panel"
            class="card"
            style="position:sticky;
                top:6rem;
                align-self:start"
        >
        </div>
    </div>
</div>

<!-- Add Member Dialog -->
<div
    class="dialog-backdrop hidden"
    id="add-member-backdrop"
>
    <div
        class="dialog hidden"
        id="add-member-dialog"
        aria-hidden="true"
        style="max-width:28rem"
    >
        <div class="dialog-header">
            <h3 class="dialog-title">
                Add Team Member
            </h3>
            <p class="dialog-description">
                Invite a new member to
                join your team.
            </p>
        </div>
        <div
            class="flex flex-col gap-4"
        >
            <div>
                <label
                    class="label mb-1"
                    for="add-member-name"
                >Full Name</label>
                <input
                    class="input"
                    id="add-member-name"
                    placeholder="Enter
                        full name"
                />
            </div>
            <div>
                <label
                    class="label mb-1"
                    for="add-member-email"
                >Email Address</label>
                <input
                    class="input"
                    id="add-member-email"
                    type="email"
                    placeholder=
                        "email@company.com"
                />
            </div>
            <div>
                <label
                    class="label mb-1"
                    for="add-member-role"
                >Role</label>
                <input
                    class="input"
                    id="add-member-role"
                    placeholder="e.g.
                        Software Engineer"
                />
            </div>
            <div>
                <label
                    class="label mb-1"
                    for="add-member-department"
                >Department</label>
                <select
                    class="input"
                    id="add-member-department"
                >
                    <option value="">
                        Select department
                    </option>
                    <option>
                        Engineering
                    </option>
                    <option>Design</option>
                    <option>Product</option>
                    <option>
                        Operations
                    </option>
                    <option>
                        Analytics
                    </option>
                    <option>
                        Marketing
                    </option>
                </select>
            </div>
        </div>
        <div class="dialog-footer">
            <button
                class="btn btn-outline"
                id="add-member-cancel"
            >Cancel</button>
            <button
                class="btn btn-primary"
                id="add-member-send"
            >Send Invitation</button>
        </div>
    </div>
</div>
