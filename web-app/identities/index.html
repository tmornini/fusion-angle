<div class="workspace">
    <div class="page-header">
        <div>
            <h1 class="page-title">Identities</h1>
            <p class="text-sm text-muted">
                People and services across the
                platform
            </p>
        </div>
        <button
            class="btn btn-primary gap-2"
            id="add-identity-btn"
        >
            <span id="add-identity-btn-icon"></span>
            Add Identity
        </button>
    </div>

    <div
        id="identity-list"
        class="flex flex-col gap-3"
    ></div>

    <dialog
        id="add-identity-dialog"
        class="dialog dialog-wide"
        role="dialog"
        aria-modal="true"
    >
        <div class="dialog-header">
            <h3
                class="dialog-title flex
                    items-center gap-2"
            >
                <span
                    id="add-identity-dialog-icon"
                ></span>
                Add Identity
            </h3>
        </div>
        <div
            class="flex flex-col gap-3 py-4
                dialog-scroll"
        >
            <fieldset
                class="flex items-center gap-4"
                id="add-identity-kind-toggle"
            >
                <legend class="label mr-2"
                >Kind</legend>
                <label
                    class="flex items-center gap-1"
                >
                    <input
                        type="radio"
                        name="identity-kind"
                        value="person"
                        checked
                    />
                    Person
                </label>
                <label
                    class="flex items-center gap-1"
                >
                    <input
                        type="radio"
                        name="identity-kind"
                        value="service"
                    />
                    Service
                </label>
            </fieldset>

            <div
                id="add-identity-person-form"
                class="flex flex-col gap-3"
            >
                <div>
                    <label
                        class="label mb-1 block"
                        for="id-name"
                    >Name</label>
                    <input
                        class="input"
                        id="id-name"
                        placeholder="Full name"
                    />
                </div>
                <div>
                    <label
                        class="label mb-1 block"
                        for="id-email"
                    >Email</label>
                    <input
                        class="input"
                        type="email"
                        placeholder="person@company.com"
                        id="id-email"
                    />
                </div>
                <div>
                    <label
                        class="label mb-1 block"
                        for="id-phone"
                    >Phone</label>
                    <input
                        class="input"
                        id="id-phone"
                        placeholder="+1 (555) 000-0000"
                    />
                </div>
                <div>
                    <label
                        class="label mb-1 block"
                        for="id-bio"
                    >Bio</label>
                    <textarea
                        class="textarea"
                        rows="2"
                        id="id-bio"
                        placeholder="Short bio..."
                    ></textarea>
                </div>
            </div>

            <div
                id="add-identity-service-form"
                class="flex flex-col gap-3 hidden"
            >
                <div>
                    <label
                        class="label mb-1 block"
                        for="svc-secret"
                    >Client Secret</label>
                    <input
                        class="input"
                        id="svc-secret"
                        placeholder="Enter a client
                            secret"
                    />
                    <p class="text-xs text-muted mt-1">
                        Required. Shown only here and
                        not recoverable — store it now.
                    </p>
                </div>
            </div>
        </div>
        <div class="dialog-footer">
            <button
                class="btn btn-outline"
                id="add-identity-cancel"
            >Cancel</button>
            <button
                class="btn btn-primary gap-2"
                id="add-identity-submit"
            >
                <span
                    id="add-identity-submit-icon"
                ></span>
                Create
            </button>
        </div>
    </dialog>
</div>
