<div class="workspace">
    <div class="page-header workbox-header">
        <div>
            <h1 class="page-title">
                Workbox
            </h1>
        </div>
        <div class="search-wrapper search-wrapper-wide">
            <span
                class="search-icon"
                id="workbox-search-icon"
            ></span>
            <input
                id="workbox-search"
                type="search"
                class="input search-input"
                placeholder="Search work orders..."
                aria-label="Search work orders"
            />
        </div>
        <div
            class="workbox-header-actions flex
                flex-wrap items-center gap-3"
            id="workbox-header-actions"
        >
            <div class="dropdown">
                <button
                    class="btn btn-primary gap-2"
                    id="create-work-order-btn"
                >
                    <span
                        id="create-work-order-btn-icon"
                    ></span>
                    <span
                        class="hidden-mobile"
                    >Create Work Order</span><span
                        class="visible-mobile"
                    >Create</span>
                </button>
                <div
                    class="dropdown-content
                        hidden"
                    id="create-work-order-dropdown"
                    data-align="end"
                >
                </div>
            </div>
        </div>
    </div>

    <div
        id="workbox-pills"
        class="flex flex-wrap items-center gap-2 mb-6"
        role="group"
        aria-label="Filter work orders"
    >
    </div>

    <div
        id="workbox-inbox"
        class="grid grid-cols-1 gap-6"
    >
        <div
            id="work-order-lists"
            class="min-w-0"
        >
        </div>
        <section
            id="work-order-box"
            class="card p-4 min-w-0
                workbox-work-order"
            aria-label="Work order"
            tabindex="-1"
        >
        </section>
    </div>
</div>
