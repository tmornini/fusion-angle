<div class="workspace">
    <div class="page-header">
        <div>
            <h1 class="page-title">
                Workbox
            </h1>
        </div>
        <div
            class="flex flex-wrap
                items-center gap-3"
        >
            <div class="dropdown">
                <button
                    class="btn btn-primary gap-2"
                    id="create-work-order-btn"
                >
                    <span
                        id="create-work-order-btn-icon"
                    ></span>
                    <span
                        class="hidden-mobile"
                    >Create Work Order</span><span
                        class="visible-mobile"
                    >Create</span>
                </button>
                <div
                    class="dropdown-content
                        hidden"
                    id="create-work-order-dropdown"
                    data-align="end"
                >
                </div>
            </div>
        </div>
    </div>

    <div
        id="workbox-inbox"
        class="grid grid-cols-1
            md:grid-cols-2 gap-6"
    >
        <div class="card p-4">
            <h2
                class="text-lg font-semibold
                    mb-4"
            >
                Work Orders available to me
            </h2>
            <div
                id="available-list"
                class="flex flex-col gap-3"
                data-inbox-list="available"
            >
            </div>
        </div>
        <div class="card p-4">
            <div
                class="flex items-center
                    justify-between gap-3
                    mb-4"
            >
                <h2
                    class="text-lg
                        font-semibold"
                >
                    Work Orders claimed by me
                </h2>
                <div
                    class="flex items-center
                        gap-2"
                    role="group"
                    aria-label="Claimed or archived by me"
                >
                    <button
                        type="button"
                        class="btn btn-secondary
                            btn-sm"
                        data-inbox-pill="claimed"
                        aria-pressed="true"
                    >Active</button>
                    <button
                        type="button"
                        class="btn btn-secondary
                            btn-sm"
                        data-inbox-pill="archivedByMe"
                        aria-pressed="false"
                    >Archived by Me</button>
                </div>
            </div>
            <div
                id="claimed-list"
                class="flex flex-col gap-3"
                data-inbox-list="claimed"
            >
            </div>
        </div>
    </div>
</div>
