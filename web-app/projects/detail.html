<div id="project-detail-content">
</div>

<dialog id="approve-dialog"
    class="dialog"
    role="dialog" aria-labelledby="approve-title">
    <div class="dialog-header">
        <h3 id="approve-title"
            class="dialog-title">Confirm approval</h3>
    </div>
    <p id="approve-message"
        class="text-sm text-muted"></p>
    <div class="dialog-footer">
        <button class="btn btn-outline"
            data-action="cancel-approve">
            Cancel
        </button>
        <button class="btn btn-primary"
            data-action="confirm-approve">
            Approve
        </button>
    </div>
</dialog>

<dialog id="archive-dialog"
    class="dialog"
    role="dialog" aria-labelledby="archive-title">
    <div class="dialog-header">
        <h3 id="archive-title"
            class="dialog-title">Confirm archival</h3>
    </div>
    <p id="archive-message"
        class="text-sm text-muted"></p>
    <div class="dialog-footer">
        <button class="btn btn-outline"
            data-action="cancel-archive">
            Cancel
        </button>
        <button class="btn btn-primary"
            data-action="confirm-archive">
            Archive
        </button>
    </div>
</dialog>

<dialog id="history-dialog"
    class="dialog dialog-xwide"
    aria-labelledby="history-title">
    <div id="history-modal-body"></div>
</dialog>
