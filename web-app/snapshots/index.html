<!-- snapshots page content -->
<div class="page-header">
    <div>
        <h1 class="page-title">Snapshots</h1>
        <p class="text-muted">
            Manage application data — wipe,
            reload mock data, upload or
            download snapshots.
        </p>
    </div>
</div>

<div
    id="snapshots-content"
    style="display:grid;
        grid-template-columns:
            repeat(auto-fill,minmax(18rem,1fr));
        gap:1.5rem;
        margin-top:1.5rem"
>
</div>

<div
    id="confirm-wipe-backdrop"
    class="dialog-backdrop hidden"
></div>
<div
    id="confirm-wipe-dialog"
    class="dialog hidden"
    aria-hidden="true"
    role="alertdialog"
    aria-labelledby="confirm-wipe-title"
    aria-describedby="confirm-wipe-message"
>
    <h3
        id="confirm-wipe-title"
        class="font-display font-semibold mb-4"
    >
        Confirm Action
    </h3>
    <p
        id="confirm-wipe-message"
        class="text-sm text-muted mb-6"
    ></p>
    <div
        class="flex justify-end gap-3"
    >
        <button
            id="confirm-wipe-cancel"
            class="btn btn-outline btn-sm"
        >Cancel</button>
        <button
            id="confirm-wipe-submit"
            class="btn btn-primary btn-sm"
        >OK</button>
    </div>
</div>
