<!-- snapshots page content -->
<div class="page-header">
    <div>
        <h1 class="page-title">Snapshots</h1>
        <p class="text-sm text-muted">
            Manage application data — wipe,
            reload mock data, upload or
            download snapshots.
        </p>
    </div>
</div>

<div
    id="snapshots-content"
    style="display:grid;
        grid-template-columns:
            repeat(auto-fill,minmax(18rem,1fr));
        gap:1.5rem;
        margin-top:1.5rem"
>
</div>

<div
    id="confirm-wipe-backdrop"
    class="dialog-backdrop hidden"
></div>
<div
    id="confirm-wipe-dialog"
    class="dialog hidden"
    aria-hidden="true"
    role="alertdialog"
    aria-labelledby="confirm-wipe-title"
    aria-describedby="confirm-wipe-message"
>
    <div class="dialog-header">
        <h3
            id="confirm-wipe-title"
            class="dialog-title"
        >Confirm Action</h3>
    </div>
    <p
        id="confirm-wipe-message"
        class="text-sm text-muted"
    ></p>
    <div class="dialog-footer">
        <button
            id="confirm-wipe-cancel"
            class="btn btn-outline"
        >Cancel</button>
        <button
            id="confirm-wipe-submit"
            class="btn btn-primary"
        >Confirm</button>
    </div>
</div>
