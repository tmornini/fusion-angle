<div>
    <div class="page-header">
        <div>
            <h1 class="page-title">Flows</h1>
            <p class="text-sm text-muted">
                Visual state machine flows
                for your projects
            </p>
        </div>
        <button
            class="btn btn-primary btn-sm"
            id="import-flow-btn"
        >Import Flow</button>
        <input
            type="file"
            id="import-flow-input"
            accept=".mmd,.zip"
            class="hidden"
        >
    </div>

    <div
        class="dialog-backdrop hidden"
        id="import-flow-backdrop"
    >
        <div
            class="dialog hidden"
            id="import-flow-dialog"
            aria-hidden="true"
            style="max-width:28rem"
        >
            <div class="dialog-header">
                <h3 class="dialog-title">
                    Import Flow
                </h3>
                <p class="dialog-description">
                    Select a project and
                    choose a .mmd or
                    .zip file
                </p>
            </div>
            <div>
                <label
                    class="label mb-1"
                    for="import-project"
                >Project</label>
                <select
                    id="import-project"
                    class="input w-full"
                ></select>
            </div>
            <div class="dialog-footer">
                <button
                    class="btn btn-outline"
                    id="import-cancel"
                >Cancel</button>
                <button
                    class="btn btn-primary"
                    id="import-choose"
                >Choose File</button>
            </div>
        </div>
    </div>

    <div
        id="flow-list"
        class="flex flex-col gap-3"
    >
    </div>
</div>
