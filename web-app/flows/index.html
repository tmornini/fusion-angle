<div class="workspace">
    <div class="page-header">
        <div>
            <h1 class="page-title">Flows</h1>
            <p class="text-sm text-muted">
                Visual state machine flows
                for your projects
            </p>
        </div>
        <button
            class="btn btn-primary btn-sm"
            id="import-flow-btn"
        >Import Flow</button>
        <input
            type="file"
            id="import-flow-input"
            accept=".mmd,.zip"
            class="hidden"
        >
    </div>

    <dialog
        class="dialog dialog-narrow"
        id="import-flow-dialog"
        role="dialog"
        aria-labelledby="import-flow-title"
    >
        <div class="dialog-header">
            <h3 class="dialog-title"
                id="import-flow-title">
                Import Flow
            </h3>
            <p
                id="import-description"
                class="dialog-description"
            >
                Select a project and
                choose a .mmd (flowchart
                or state diagram) or
                .zip file
            </p>
        </div>
        <div
            id="import-project-section"
        >
            <label
                class="label mb-1"
                for="import-project"
            >Project</label>
            <select
                id="import-project"
                class="input w-full"
            ></select>
        </div>
        <div class="dialog-footer">
            <button
                class="btn btn-outline"
                data-dialog-cancel="import-flow"
            >Cancel</button>
            <button
                class="btn btn-primary
                    hidden"
                id="import-overwrite"
            >Overwrite</button>
            <button
                class="btn btn-outline
                    hidden"
                id="import-create-new"
            >Create New</button>
            <button
                class="btn btn-primary
                    hidden"
                id="import-create"
            >Create</button>
            <button
                class="btn btn-primary"
                id="import-choose"
            >Choose File</button>
        </div>
    </dialog>

    <div
        id="flow-list"
        class="flex flex-col gap-3"
    >
    </div>
</div>
