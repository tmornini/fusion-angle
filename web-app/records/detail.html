<div class="workspace">
    <div id="page-root"></div>
</div>

<dialog id="confirm-delete-instance-dialog"
    class="dialog dialog-narrow"
    role="alertdialog"
    aria-labelledby="confirm-delete-instance-title"
    aria-describedby="confirm-delete-instance-message">
    <div class="dialog-header">
        <h3 id="confirm-delete-instance-title"
            class="dialog-title">
            Delete instance?</h3>
    </div>
    <p id="confirm-delete-instance-message"
        class="text-sm text-muted">
        This removes the instance. The address
        stays spent and cannot be recreated.
    </p>
    <div class="dialog-footer">
        <button class="btn btn-outline"
            data-dialog-cancel="confirm-delete-instance">
            Cancel
        </button>
        <button class="btn btn-destructive"
            data-action="confirm-delete-instance">
            Delete
        </button>
    </div>
</dialog>
