<div class="workspace">
    <div class="page-header">
        <div>
            <h1 class="page-title">Members</h1>
            <p class="text-sm text-muted">
                Manage humans and AIs in your
                organization
            </p>
        </div>
        <div class="flex items-center gap-2">
            <button
                class="btn btn-secondary gap-2"
                id="invite-member-btn"
            >
                <span
                    id="invite-member-btn-icon"
                ></span>
                Invite member
            </button>
            <button
                class="btn btn-primary gap-2"
                id="add-member-btn"
            >
                <span id="add-member-btn-icon"></span>
                Add Member
            </button>
        </div>
    </div>

    <div class="flex items-center gap-4 mb-6">
        <div
            class="search-wrapper flex-1
                search-wrapper-md"
        >
            <span
                class="search-icon"
                id="member-search-icon"
            ></span>
            <input
                class="input search-input"
                placeholder="Search members..."
                id="member-search"
                aria-label="Search members"
            />
        </div>
        <div
            class="flex items-center gap-2"
            role="tablist"
            aria-label="Filter by kind"
        >
            <button
                class="btn btn-secondary btn-sm"
                data-kind-chip="all"
                aria-pressed="true"
            >All</button>
            <button
                class="btn btn-secondary btn-sm"
                data-kind-chip="human"
                aria-pressed="false"
            >Humans</button>
            <button
                class="btn btn-secondary btn-sm"
                data-kind-chip="ai"
                aria-pressed="false"
            >AIs</button>
        </div>
    </div>

    <div
        id="member-list"
        class="flex flex-col gap-3"
    ></div>

    <div
        id="add-member-backdrop"
        class="dialog-backdrop hidden"
    ></div>
    <div
        id="add-member-dialog"
        class="dialog dialog-wide hidden"
        aria-hidden="true"
        role="dialog"
        aria-modal="true"
    >
        <div class="dialog-header">
            <h3
                class="dialog-title flex
                    items-center gap-2"
            >
                <span
                    id="add-member-dialog-icon"
                ></span>
                Add Member
            </h3>
        </div>
        <div
            class="flex flex-col gap-3 py-4
                dialog-scroll"
        >
            <fieldset
                class="flex items-center gap-4"
                id="add-member-kind-toggle"
            >
                <legend class="label mr-2"
                >Kind</legend>
                <label
                    class="flex items-center gap-1"
                >
                    <input
                        type="radio"
                        name="member-kind"
                        value="human"
                        checked
                    />
                    Human
                </label>
                <label
                    class="flex items-center gap-1"
                >
                    <input
                        type="radio"
                        name="member-kind"
                        value="ai"
                    />
                    AI
                </label>
            </fieldset>

            <div
                id="add-member-human-form"
                class="flex flex-col gap-3"
            >
                <div>
                    <label
                        class="label mb-1 block"
                        for="hw-name"
                    >Name</label>
                    <input
                        class="input"
                        id="hw-name"
                        placeholder="Full name"
                    />
                </div>
                <div>
                    <label
                        class="label mb-1 block"
                        for="hw-email"
                    >Email</label>
                    <input
                        class="input"
                        type="email"
                        placeholder="person@company.com"
                        id="hw-email"
                    />
                </div>
                <div class="flex gap-3">
                    <div class="flex-1">
                        <label
                            class="label mb-1 block"
                            for="hw-title"
                        >Title</label>
                        <input
                            class="input"
                            type="text"
                            placeholder="e.g. Engineer"
                            id="hw-title"
                        />
                    </div>
                    <div class="flex-1">
                        <label
                            class="label mb-1 block"
                            for="hw-department"
                        >Department</label>
                        <select
                            class="input"
                            id="hw-department"
                        >
                            <option
                                value="Engineering"
                            >Engineering</option>
                            <option
                                value="Product"
                            >Product</option>
                            <option
                                value="Design"
                            >Design</option>
                            <option
                                value="Sales"
                            >Sales</option>
                            <option
                                value="Operations"
                            >Operations</option>
                            <option
                                value="Analytics"
                            >Analytics</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label
                        class="label mb-1 block"
                        for="hw-phone"
                    >Phone</label>
                    <input
                        class="input"
                        id="hw-phone"
                        placeholder="+1 (555) 000-0000"
                    />
                </div>
                <div>
                    <label
                        class="label mb-1 block"
                        for="hw-bio"
                    >Bio</label>
                    <textarea
                        class="textarea"
                        rows="2"
                        id="hw-bio"
                        placeholder="Short bio..."
                    ></textarea>
                </div>
            </div>

            <div
                id="add-member-ai-form"
                class="flex flex-col gap-3 hidden"
            >
                <div>
                    <label
                        class="label mb-1 block"
                        for="ai-name"
                    >Name</label>
                    <input
                        class="input"
                        id="ai-name"
                        placeholder="e.g. Claude Opus"
                    />
                </div>
                <div>
                    <label
                        class="label mb-1 block"
                        for="ai-model"
                    >Model</label>
                    <select
                        class="input"
                        id="ai-model"
                    ></select>
                </div>
                <div>
                    <label
                        class="label mb-1 block"
                        for="ai-description"
                    >Description</label>
                    <textarea
                        class="textarea"
                        rows="2"
                        id="ai-description"
                        placeholder="Short description..."
                    ></textarea>
                </div>
                <div>
                    <label
                        class="label mb-1 block"
                        for="ai-skill-focus"
                    >Skill Focus</label>
                    <textarea
                        class="textarea"
                        rows="2"
                        id="ai-skill-focus"
                        placeholder="Skill focus…"
                    ></textarea>
                </div>
            </div>
        </div>
        <div class="dialog-footer">
            <button
                class="btn btn-outline"
                id="add-member-cancel"
            >Cancel</button>
            <button
                class="btn btn-primary gap-2"
                id="add-member-submit"
            >
                <span
                    id="add-member-submit-icon"
                ></span>
                Create
            </button>
        </div>
    </div>

    <div
        id="invite-member-backdrop"
        class="dialog-backdrop hidden"
    ></div>
    <div
        id="invite-member-dialog"
        class="dialog hidden"
        aria-hidden="true"
        role="dialog"
        aria-modal="true"
    >
        <div class="dialog-header">
            <h3
                class="dialog-title flex
                    items-center gap-2"
            >
                <span
                    id="invite-member-dialog-icon"
                ></span>
                Invite member
            </h3>
        </div>
        <div class="flex flex-col gap-3 py-4">
            <p class="text-sm text-muted">
                Invite an existing person to this
                organization by email. They decide
                whether to accept or decline.
            </p>
            <div>
                <label
                    class="label mb-1 block"
                    for="invite-email"
                >Email</label>
                <input
                    class="input"
                    type="email"
                    id="invite-email"
                    placeholder="person@company.com"
                />
                <p
                    class="text-sm text-error mt-1 hidden"
                    id="invite-email-error"
                ></p>
            </div>
        </div>
        <div class="dialog-footer">
            <button
                class="btn btn-outline"
                id="invite-member-cancel"
            >Cancel</button>
            <button
                class="btn btn-primary gap-2"
                id="invite-member-submit"
            >
                <span
                    id="invite-member-submit-icon"
                ></span>
                Send invitation
            </button>
        </div>
    </div>
</div>
