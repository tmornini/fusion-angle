<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 905 414" width="905" height="414">
  <defs>
    <marker id="fk-arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="hsl(217 34% 60%)" />
    </marker>
    <style>
      text { font-family: ui-sans-serif, system-ui,
        'Segoe UI', Helvetica, Arial, sans-serif; }
      .box { fill: hsl(0 0% 100%);
        stroke: hsl(217 30% 88%); stroke-width: 1; }
      .head { fill: hsl(217 36% 46%); }
      .thead { fill: hsl(0 0% 100%); font-size: 12px;
        font-weight: 700; }
      .col, .pk, .fk, .type { font-size: 11px;
        dominant-baseline: middle; }
      .col { fill: hsl(217 45% 15%); }
      .pk { fill: hsl(217 45% 15%); font-weight: 700; }
      .fk { fill: hsl(217 38% 38%);
        font-style: italic; }
      .type { fill: hsl(217 12% 55%);
        text-anchor: end; }
      .edge { fill: none; stroke: hsl(217 34% 60%);
        stroke-width: 1.5; }
      .secondary-index { font-size: 24px; font-weight: 700;
        fill: hsl(217 36% 46%);
        dominant-baseline: middle; }
      .diamond, .sname, .skeys {
        dominant-baseline: middle; }
      .diamond { font-size: 11px; text-anchor: middle; }
      .diamond-pk { font-weight: 700; }
      .sbox { fill: hsl(0 0% 100%);
        stroke: hsl(217 30% 88%); stroke-width: 1; }
      .shead { fill: hsl(217 28% 62%); }
      .sthead { fill: hsl(0 0% 100%); font-size: 12px;
        font-weight: 700; }
      .sname { fill: hsl(217 45% 15%); font-size: 11px; }
      .skeys { fill: hsl(217 12% 55%); font-size: 11px;
        text-anchor: end; }
      .slink { fill: none; stroke: hsl(217 34% 60%);
        stroke-width: 1.5; }
    </style>
  </defs>
  <rect x="0" y="0" width="905" height="414" fill="hsl(217 30% 97%)" />
  <path class="slink" d="M 347 207 H 375" />
  <g class="table">
    <rect class="box" x="56" y="40" width="291" height="334" rx="6" />
    <rect class="head" x="56" y="40" width="291" height="26" rx="6" />
    <text class="thead" x="66" y="58">message_pairs</text>
    <text class="pk" x="88" y="80">id</text>
    <text class="type" x="271" y="80">id</text>
    <text class="diamond diamond-pk" x="283" y="80" fill="hsl(217 45% 15%)">◆</text>
    <text class="diamond" x="295" y="80" fill="hsl(217 36% 46%)">◆</text>
    <text class="diamond" x="307" y="80" fill="hsl(173 42% 32%)">◆</text>
    <text class="secondary-index" x="66" y="108">▸</text>
    <text class="col" x="88" y="108">uri_collection</text>
    <text class="type" x="271" y="108">text</text>
    <text class="diamond" x="295" y="108" fill="hsl(217 36% 46%)">◆</text>
    <text class="diamond" x="307" y="108" fill="hsl(173 42% 32%)">◆</text>
    <text class="col" x="88" y="136">uri_id</text>
    <text class="type" x="271" y="136">text</text>
    <text class="diamond" x="295" y="136" fill="hsl(217 36% 46%)">◆</text>
    <text class="col" x="88" y="164">requester_identity_id</text>
    <text class="type" x="271" y="164">id</text>
    <text class="col" x="88" y="192">method</text>
    <text class="type" x="271" y="192">text</text>
    <text class="col" x="88" y="220">request_at</text>
    <text class="type" x="271" y="220">text</text>
    <text class="secondary-index" x="66" y="248">▸</text>
    <text class="col" x="88" y="248">request_hash</text>
    <text class="type" x="271" y="248">text</text>
    <text class="diamond" x="319" y="248" fill="hsl(32 70% 42%)">◆</text>
    <text class="col" x="88" y="276">request</text>
    <text class="type" x="271" y="276">text</text>
    <text class="col" x="88" y="304">response_at</text>
    <text class="type" x="271" y="304">text</text>
    <text class="diamond" x="295" y="304" fill="hsl(217 36% 46%)">◆</text>
    <text class="diamond" x="307" y="304" fill="hsl(173 42% 32%)">◆</text>
    <text class="col" x="88" y="332">response</text>
    <text class="type" x="271" y="332">text</text>
    <text class="diamond" x="331" y="332" fill="hsl(350 48% 44%)">◆</text>
    <text class="col" x="88" y="360">operation_id</text>
    <text class="type" x="271" y="360">text</text>
  </g>
  <g class="sidecar">
    <rect class="sbox" x="375" y="149" width="490" height="116" rx="6" />
    <rect class="shead" x="375" y="149" width="490" height="26" rx="6" />
    <text class="sthead" x="385" y="167">indexes</text>
    <text class="diamond diamond-pk" x="391" y="184" fill="hsl(217 45% 15%)">◆</text>
    <text class="sname" x="405" y="184">pk btree</text>
    <text class="skeys" x="855" y="184">id</text>
    <text class="diamond" x="391" y="202" fill="hsl(217 36% 46%)">◆</text>
    <text class="sname" x="405" y="202">address btree</text>
    <text class="skeys" x="855" y="202">uri_collection, uri_id, response_at, id</text>
    <text class="diamond" x="391" y="220" fill="hsl(173 42% 32%)">◆</text>
    <text class="sname" x="405" y="220">collection btree</text>
    <text class="skeys" x="855" y="220">uri_collection, response_at, id</text>
    <text class="diamond" x="391" y="238" fill="hsl(32 70% 42%)">◆</text>
    <text class="sname" x="405" y="238">replay btree</text>
    <text class="skeys" x="855" y="238">request_hash</text>
    <text class="diamond" x="391" y="256" fill="hsl(350 48% 44%)">◆</text>
    <text class="sname" x="405" y="256">body gin jsonb_path_ops</text>
    <text class="skeys" x="855" y="256">message_body(response)</text>
  </g>
