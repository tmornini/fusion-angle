      .pk { fill: hsl(217 45% 15%); font-weight: 700; }
      .fk { fill: hsl(217 38% 38%);
        font-style: italic; }
      .type { fill: hsl(217 12% 55%);
        text-anchor: end; }
      .edge { fill: none; stroke: hsl(217 34% 60%);
        stroke-width: 1.5; }
    </style>
  </defs>
  <rect x="0" y="0" width="288" height="450" fill="hsl(217 30% 97%)" />
  <g class="table">
