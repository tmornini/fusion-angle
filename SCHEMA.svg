      .sname { fill: hsl(217 45% 15%); font-size: 11px; }
      .skeys { fill: hsl(217 12% 55%); font-size: 11px;
        text-anchor: end; }
      .slink { fill: none; stroke: hsl(217 34% 60%);
        stroke-width: 1.5; }
