<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <style>
      text {
        font-family: -apple-system, BlinkMacSystemFont,
          'Segoe UI', Helvetica, Arial, sans-serif;
      }
      .title {
        font-size: 16px; font-weight: 700; fill: #333;
      }
      .subtitle {
        font-size: 11px; fill: #777;
      }
      .group-label {
        font-size: 12px; font-weight: 700;
        letter-spacing: 0.5px;
      }
      .sub-label {
        font-size: 9px; font-weight: 600; opacity: 0.6;
      }
      .tbl {
        font-size: 10px; font-weight: 600; fill: #fff;
      }
      .tbl-rel {
        font-size: 9px; font-weight: 500; fill: #fff;
      }
      .arrow {
        stroke-width: 0.9; fill: none; opacity: 0.4;
      }
      .legend-text {
        font-size: 10px; fill: #555;
      }
      .legend-label {
        font-size: 11px; font-weight: 700; fill: #555;
      }
      .note {
        font-size: 9.5px; fill: #999;
      }
      .col {
        font-size: 8.5px; fill: #666;
      }
    </style>
    <marker id="aCore" markerWidth="6" markerHeight="5"
      refX="6" refY="2.5" orient="auto">
      <polygon points="0 0,6 2.5,0 5" fill="#4B6CA1"
        opacity="0.5"/>
    </marker>
    <marker id="aTools" markerWidth="6" markerHeight="5"
      refX="6" refY="2.5" orient="auto">
      <polygon points="0 0,6 2.5,0 5" fill="#6B8E23"
        opacity="0.5"/>
    </marker>
    <marker id="aWorkbox" markerWidth="6" markerHeight="5"
      refX="6" refY="2.5" orient="auto">
      <polygon points="0 0,6 2.5,0 5" fill="#B45309"
        opacity="0.5"/>
    </marker>
    <marker id="aPlatform" markerWidth="6" markerHeight="5"
      refX="6" refY="2.5" orient="auto">
      <polygon points="0 0,6 2.5,0 5" fill="#64748b"
        opacity="0.5"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="#fff"/>

  <!-- Title -->
  <text x="600" y="26" text-anchor="middle" class="title">
    Fusion AI Database Schema
  </text>
  <text x="600" y="44" text-anchor="middle" class="subtitle">
    18 tables · localStorage-backed · all columns NOT NULL
  </text>

  <!-- ============================================ -->
  <!-- CORE ENTITIES (4)                            -->
  <!-- ============================================ -->
  <rect x="16" y="64" width="340" height="128" rx="6"
    fill="#EDF1F7" stroke="#4B6CA1"
    stroke-width="1.2" opacity="0.55"/>
  <text x="28" y="82" class="group-label" fill="#4B6CA1">
    CORE ENTITIES (4)
  </text>

  <rect x="28" y="96" width="140" height="28" rx="4"
    fill="#4B6CA1"/>
  <text x="98" y="114" text-anchor="middle" class="tbl">
    users</text>

  <rect x="184" y="96" width="140" height="28" rx="4"
    fill="#4B6CA1"/>
  <text x="254" y="114" text-anchor="middle" class="tbl">
    ideas</text>

  <rect x="28" y="140" width="140" height="28" rx="4"
    fill="#4B6CA1"/>
  <text x="98" y="158" text-anchor="middle" class="tbl">
    projects</text>

  <rect x="184" y="140" width="140" height="28" rx="4"
    fill="#4B6CA1"/>
  <text x="254" y="158" text-anchor="middle" class="tbl">
    team_memberships</text>

  <text x="98" y="183" text-anchor="middle" class="sub-label">
    15 cols</text>
  <text x="254" y="183" text-anchor="middle" class="sub-label">
    13 cols</text>
  <text x="98" y="183" text-anchor="middle" class="sub-label"
    transform="translate(0,44)">17 cols</text>
  <text x="254" y="183" text-anchor="middle" class="sub-label"
    transform="translate(0,44)">4 cols</text>

  <!-- ============================================ -->
  <!-- TOOLS (1)                                    -->
  <!-- ============================================ -->
  <rect x="372" y="64" width="140" height="128" rx="6"
    fill="#F2F5EC" stroke="#6B8E23"
    stroke-width="1.2" opacity="0.55"/>
  <text x="384" y="82" class="group-label" fill="#6B8E23">
    TOOLS (1)
  </text>

  <rect x="384" y="114" width="116" height="28" rx="4"
    fill="#6B8E23"/>
  <text x="442" y="132" text-anchor="middle" class="tbl">
    flows</text>
  <text x="442" y="156" text-anchor="middle" class="sub-label">
    10 cols · graph JSON</text>

  <!-- ============================================ -->
  <!-- WORKBOX (1)                                  -->
  <!-- ============================================ -->
  <rect x="528" y="64" width="150" height="128" rx="6"
    fill="#FCF0E4" stroke="#B45309"
    stroke-width="1.2" opacity="0.55"/>
  <text x="540" y="82" class="group-label" fill="#B45309">
    WORKBOX (1)
  </text>

  <rect x="540" y="114" width="126" height="28" rx="4"
    fill="#B45309"/>
  <text x="603" y="132" text-anchor="middle" class="tbl">
    work_orders</text>
  <text x="603" y="156" text-anchor="middle" class="sub-label">
    5 cols · flow_graph snapshot</text>

  <!-- ============================================ -->
  <!-- PLATFORM (1)                                 -->
  <!-- ============================================ -->
  <rect x="694" y="64" width="140" height="128" rx="6"
    fill="#EFF2F5" stroke="#64748b"
    stroke-width="1.2" opacity="0.55"/>
  <text x="706" y="82" class="group-label" fill="#64748b">
    PLATFORM (1)
  </text>

  <rect x="706" y="114" width="116" height="28" rx="4"
    fill="#64748b"/>
  <text x="764" y="132" text-anchor="middle" class="tbl">
    activities</text>
  <text x="764" y="156" text-anchor="middle" class="sub-label">
    8 cols · audit log</text>

  <!-- ============================================ -->
  <!-- ADMIN SINGLETONS (2)                         -->
  <!-- ============================================ -->
  <rect x="850" y="64" width="334" height="128" rx="6"
    fill="#EDEFF2" stroke="#475569"
    stroke-width="1.2" opacity="0.55"/>
  <text x="862" y="82" class="group-label" fill="#475569">
    ADMIN SINGLETONS (2)
  </text>

  <rect x="862" y="96" width="180" height="28" rx="4"
    fill="#475569"/>
  <text x="952" y="114" text-anchor="middle" class="tbl">
    company_settings</text>

  <rect x="1056" y="96" width="116" height="28" rx="4"
    fill="#475569"/>
  <text x="1114" y="114" text-anchor="middle" class="tbl">
    account</text>

  <text x="862" y="145" class="col">name, domain</text>
  <text x="1056" y="145" class="col">plan, seats, limits,
    health (17 cols)</text>
  <text x="1018" y="178" text-anchor="middle" class="sub-label">
    single row each (id = '1')</text>

  <!-- ============================================ -->
  <!-- RELATIONSHIPS &amp; HISTORY (9)              -->
  <!-- ============================================ -->
  <rect x="16" y="232" width="1168" height="340" rx="6"
    fill="#F5F6F8" stroke="#94a3b8"
    stroke-width="1.2" opacity="0.55"/>
  <text x="28" y="250" class="group-label" fill="#475569">
    RELATIONSHIPS &amp; HISTORY (9)
  </text>
  <text x="200" y="250" class="sub-label">
    junction tables + flow_versions (per-flow undo history,
    cap 10)
  </text>

  <!-- Row 1 of junctions -->
  <rect x="40" y="276" width="170" height="28" rx="4"
    fill="#94a3b8"/>
  <text x="125" y="294" text-anchor="middle" class="tbl-rel">
    idea_submissions</text>
  <text x="125" y="313" text-anchor="middle" class="col">
    ideas × users</text>

  <rect x="232" y="276" width="170" height="28" rx="4"
    fill="#94a3b8"/>
  <text x="317" y="294" text-anchor="middle" class="tbl-rel">
    activity_actors</text>
  <text x="317" y="313" text-anchor="middle" class="col">
    activities × users</text>

  <rect x="424" y="276" width="170" height="28" rx="4"
    fill="#94a3b8"/>
  <text x="509" y="294" text-anchor="middle" class="tbl-rel">
    project_flows</text>
  <text x="509" y="313" text-anchor="middle" class="col">
    projects × flows</text>

  <rect x="616" y="276" width="170" height="28" rx="4"
    fill="#94a3b8"/>
  <text x="701" y="294" text-anchor="middle" class="tbl-rel">
    flow_work_orders</text>
  <text x="701" y="313" text-anchor="middle" class="col">
    flows × work_orders</text>

  <rect x="808" y="276" width="170" height="28" rx="4"
    fill="#94a3b8"/>
  <text x="893" y="294" text-anchor="middle" class="tbl-rel">
    flow_versions</text>
  <text x="893" y="313" text-anchor="middle" class="col">
    history of flows</text>

  <rect x="1000" y="276" width="170" height="28" rx="4"
    fill="#94a3b8"/>
  <text x="1085" y="294" text-anchor="middle" class="tbl-rel">
    work_order_claims</text>
  <text x="1085" y="313" text-anchor="middle" class="col">
    work_orders × users</text>

  <!-- Row 2 of junctions -->
  <rect x="40" y="370" width="210" height="28" rx="4"
    fill="#94a3b8"/>
  <text x="145" y="388" text-anchor="middle" class="tbl-rel">
    work_order_transitions</text>
  <text x="145" y="407" text-anchor="middle" class="col">
    work_orders × users · events (append-only)</text>

  <rect x="280" y="370" width="240" height="28" rx="4"
    fill="#94a3b8"/>
  <text x="400" y="388" text-anchor="middle" class="tbl-rel">
    team_membership_projects</text>
  <text x="400" y="407" text-anchor="middle" class="col">
    team_memberships × projects</text>

  <rect x="550" y="370" width="220" height="28" rx="4"
    fill="#94a3b8"/>
  <text x="660" y="388" text-anchor="middle" class="tbl-rel">
    team_membership_users</text>
  <text x="660" y="407" text-anchor="middle" class="col">
    team_memberships × users</text>

  <!-- ============================================ -->
  <!-- ARROWS: junctions → parents                  -->
  <!-- ============================================ -->

  <!-- idea_submissions → ideas, users -->
  <path d="M 105 276 Q 105 220 98 124" class="arrow"
    stroke="#4B6CA1" marker-end="url(#aCore)"/>
  <path d="M 145 276 Q 180 220 254 124" class="arrow"
    stroke="#4B6CA1" marker-end="url(#aCore)"/>

  <!-- activity_actors → activities, users -->
  <path d="M 297 276 Q 200 220 98 124" class="arrow"
    stroke="#4B6CA1" marker-end="url(#aCore)"/>
  <path d="M 337 276 Q 500 220 764 142" class="arrow"
    stroke="#64748b" marker-end="url(#aPlatform)"/>

  <!-- project_flows → projects, flows -->
  <path d="M 489 276 Q 300 230 98 168" class="arrow"
    stroke="#4B6CA1" marker-end="url(#aCore)"/>
  <path d="M 529 276 Q 480 220 442 142" class="arrow"
    stroke="#6B8E23" marker-end="url(#aTools)"/>

  <!-- flow_work_orders → flows, work_orders -->
  <path d="M 681 276 Q 550 220 442 142" class="arrow"
    stroke="#6B8E23" marker-end="url(#aTools)"/>
  <path d="M 721 276 Q 660 220 603 142" class="arrow"
    stroke="#B45309" marker-end="url(#aWorkbox)"/>

  <!-- flow_versions → flows -->
  <path d="M 893 276 Q 670 220 442 142" class="arrow"
    stroke="#6B8E23" marker-end="url(#aTools)"/>

  <!-- work_order_claims → work_orders, users -->
  <path d="M 1065 276 Q 820 220 603 142" class="arrow"
    stroke="#B45309" marker-end="url(#aWorkbox)"/>
  <path d="M 1105 276 C 1130 180 500 140 98 124" class="arrow"
    stroke="#4B6CA1" marker-end="url(#aCore)"/>

  <!-- work_order_transitions → work_orders, users -->
  <path d="M 125 370 C 100 260 400 200 603 142" class="arrow"
    stroke="#B45309" marker-end="url(#aWorkbox)"/>
  <path d="M 165 370 C 120 260 60 200 98 124" class="arrow"
    stroke="#4B6CA1" marker-end="url(#aCore)"/>

  <!-- team_membership_projects → team_memberships, projects -->
  <path d="M 380 370 C 360 260 290 210 254 168" class="arrow"
    stroke="#4B6CA1" marker-end="url(#aCore)"/>
  <path d="M 420 370 C 320 260 140 210 98 168" class="arrow"
    stroke="#4B6CA1" marker-end="url(#aCore)"/>

  <!-- team_membership_users → team_memberships, users -->
  <path d="M 640 370 C 560 260 330 200 254 168" class="arrow"
    stroke="#4B6CA1" marker-end="url(#aCore)"/>
  <path d="M 680 370 C 600 260 200 180 98 124" class="arrow"
    stroke="#4B6CA1" marker-end="url(#aCore)"/>

  <!-- ============================================ -->
  <!-- LEGEND                                       -->
  <!-- ============================================ -->
  <rect x="16" y="604" width="1168" height="184" rx="6"
    fill="#fcfcfd" stroke="#e5e7eb"
    stroke-width="1" opacity="0.85"/>
  <text x="28" y="626" class="legend-label">LEGEND</text>

  <rect x="28" y="640" width="14" height="14" rx="2"
    fill="#4B6CA1"/>
  <text x="48" y="651" class="legend-text">
    Core entities · the nouns of the domain</text>

  <rect x="28" y="662" width="14" height="14" rx="2"
    fill="#6B8E23"/>
  <text x="48" y="673" class="legend-text">
    Tools · flows store their graph as a JSON document</text>

  <rect x="28" y="684" width="14" height="14" rx="2"
    fill="#B45309"/>
  <text x="48" y="695" class="legend-text">
    Workbox · work_orders hold a frozen flow_graph
    snapshot taken at creation time</text>

  <rect x="620" y="640" width="14" height="14" rx="2"
    fill="#64748b"/>
  <text x="640" y="651" class="legend-text">
    Platform · activities is the audit log</text>

  <rect x="620" y="662" width="14" height="14" rx="2"
    fill="#475569"/>
  <text x="640" y="673" class="legend-text">
    Admin singletons · single row, id = '1'
    (SingletonStore)</text>

  <rect x="620" y="684" width="14" height="14" rx="2"
    fill="#94a3b8"/>
  <text x="640" y="695" class="legend-text">
    Relationships &amp; history · junction tables plus
    flow_versions (per-flow undo)</text>

  <text x="28" y="724" class="note">
    Conventions: all columns NOT NULL · booleans stored
    as INTEGER 0|1 · timestamps RFC-3339 Zulu · durations
    in seconds · IDs are TEXT</text>
  <text x="28" y="744" class="note">
    Arrows point from a junction to the parent it
    references · arrow color matches the parent's group</text>
  <text x="28" y="764" class="note">
    work_order_transitions is event-sourced (append-only,
    no updates) · flow_versions is history-only (capped
    at 10, oldest deleted on overflow)</text>

  <text x="600" y="880" text-anchor="middle" class="note">
    Generated from SCHEMA.md and api/types.ts
  </text>
</svg>
