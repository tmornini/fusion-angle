<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Measure history</title>
<style>
:root {
  --bg: #0f1115;
  --panel: #171a21;
  --border: #2a3140;
  --text: #e7ecf3;
  --muted: #9aa6b2;
  --accent: #6ea8fe;
  --good: #3dd68c;
  --bad: #f07178;
  --boot: #6ea8fe;
  --fetch: #f0c674;
  --render: #c678dd;
  --other: #9aa6b2;
  --budget: #56b6c2;
  --band: rgba(110, 168, 254, 0.18);
  font-family: ui-sans-serif, system-ui, sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}
header {
  display: flex;
  flex-wrap: wrap;
  gap: 12px 20px;
  align-items: center;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--panel);
  position: sticky;
  top: 0;
  z-index: 20;
}
header h1 {
  font-size: 1rem;
  font-weight: 600;
  margin: 0;
}
.crumb {
  font-size: 0.85rem;
  color: var(--muted);
}
.crumb a, .crumb button.linkish {
  color: var(--accent);
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
  font: inherit;
  text-decoration: none;
}
.crumb a:hover, .crumb button.linkish:hover {
  text-decoration: underline;
}
header label {
  font-size: 0.8rem;
  color: var(--muted);
  display: flex;
  gap: 6px;
  align-items: center;
}
header select, header button.tool {
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 4px 8px;
  font-size: 0.8rem;
  cursor: pointer;
}
header button.tool:hover {
  border-color: var(--accent);
}
.summary {
  font-size: 0.8rem;
  color: var(--muted);
  margin-right: auto;
}
.view-system, .view-page { display: none; }
.view-system.active, .view-page.active {
  display: block;
}
.dash {
  padding: 16px;
  max-width: 1100px;
  margin: 0 auto;
}
.metric-row {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 16px;
}
.metric {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 12px;
  min-width: 120px;
  flex: 1 1 120px;
}
.metric .label {
  font-size: 0.7rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.metric .value {
  font-size: 1.1rem;
  font-variant-numeric: tabular-nums;
  margin-top: 2px;
}
.dash-section {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 16px;
  margin-bottom: 16px;
}
.dash-section h2 {
  font-size: 0.9rem;
  margin: 0 0 10px;
  font-weight: 600;
}
.dash-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
@media (max-width: 800px) {
  .dash-grid { grid-template-columns: 1fr; }
}
.layout {
  display: grid;
  grid-template-columns: minmax(240px, 320px) 1fr;
  min-height: calc(100vh - 56px);
}
@media (max-width: 800px) {
  .layout { grid-template-columns: 1fr; }
}
.rank, .focus {
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.focus { border-right: 0; }
.tabs {
  display: flex;
  gap: 4px;
  padding: 8px;
  border-bottom: 1px solid var(--border);
}
.tabs button {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--muted);
  border-radius: 4px;
  padding: 4px 10px;
  cursor: pointer;
  font-size: 0.8rem;
}
.tabs button[aria-selected="true"] {
  color: var(--text);
  border-color: var(--accent);
  background: #1c2433;
}
.rank-list {
  overflow: auto;
  flex: 1;
}
.rank-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  font-size: 0.85rem;
}
.rank-row:hover { background: #1a2030; }
.rank-row[aria-selected="true"] {
  background: #1c2a40;
  box-shadow: inset 3px 0 0 var(--accent);
}
.rank-meta {
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  text-align: right;
  white-space: nowrap;
}
.metric-row.page-metrics {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  margin: 0;
}
.panel-body { padding: 16px; flex: 1; }
.chart-wrap {
  position: relative;
  touch-action: none;
  user-select: none;
}
.trend-svg {
  width: 100%;
  height: 260px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  display: block;
}
.point-hit { cursor: pointer; fill: transparent; }
.point-vis { pointer-events: none; }
.sel-band { fill: var(--band); pointer-events: none; }
.candle-whisker {
  stroke: var(--muted);
  stroke-width: 1;
  pointer-events: none;
}
.candle-box {
  fill: var(--band);
  stroke: var(--accent);
  pointer-events: none;
}
.candle-median {
  stroke: var(--accent);
  stroke-width: 2;
  pointer-events: none;
}
.tooltip {
  position: fixed;
  z-index: 50;
  pointer-events: none;
  background: #1c2433;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 10px;
  font-size: 0.78rem;
  font-variant-numeric: tabular-nums;
  box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  max-width: 240px;
  display: none;
}
.tooltip.show { display: block; }
.tooltip .t-row {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin: 2px 0;
}
.tooltip .t-k { color: var(--muted); }
.table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.85rem;
  font-variant-numeric: tabular-nums;
}
.table th, .table td {
  text-align: left;
  padding: 6px 8px;
  border-bottom: 1px solid var(--border);
}
.table th {
  color: var(--muted);
  font-weight: 500;
  cursor: pointer;
  user-select: none;
}
.table th:hover { color: var(--text); }
.table tr[data-page] { cursor: pointer; }
.table tr[data-page]:hover { background: #1a2030; }
.bar-stack {
  display: flex;
  height: 28px;
  border-radius: 4px;
  overflow: hidden;
  border: 1px solid var(--border);
  margin: 12px 0;
}
.bar-seg { height: 100%; min-width: 0; }
.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  font-size: 0.8rem;
  color: var(--muted);
  margin-bottom: 12px;
}
.swatch {
  display: inline-block;
  width: 10px;
  height: 10px;
  border-radius: 2px;
  margin-right: 4px;
}
.phase-list, .budget-block {
  font-size: 0.85rem;
  font-variant-numeric: tabular-nums;
}
.phase-list div, .budget-block div {
  display: flex;
  justify-content: space-between;
  padding: 4px 0;
  border-bottom: 1px solid var(--border);
}
.muted { color: var(--muted); }
.delta-pos { color: var(--bad); }
.delta-neg { color: var(--good); }
.budget-track {
  height: 16px;
  background: #222833;
  border-radius: 4px;
  overflow: hidden;
  border: 1px solid var(--border);
  margin-top: 8px;
}
.budget-fill {
  height: 100%;
  background: var(--budget);
}
.budget-fill.over { background: var(--bad); }
.counts {
  display: flex;
  gap: 16px;
  font-size: 0.85rem;
  margin-bottom: 10px;
  flex-wrap: wrap;
}
</style>
</head>

        ? 'n/a'
        : (Math.round(e.budgetPct * 1000) / 10) + '%';
      html += '<tr data-page="' + e.page + '">'
        + '<td>' + e.page + '</td><td>'
        + (e.readyMs === null
          ? 'n/a'
          : formatDurationPerf(e.readyMs, false))
        + '</td><td class="' + dc + '">'
        + (e.deltaMs === null
          ? 'n/a'
          : formatDurationPerf(e.deltaMs, true))
        + '</td><td>' + pct + '</td></tr>';
    }
    html += '</tbody></table>';
    el.innerHTML = html;
    bindPageClicks(el);
    var ths = el.querySelectorAll('th[data-col]');
    for (var t = 0; t < ths.length; t++) {
      ths[t].addEventListener('click', function (ev) {
        sort = ev.currentTarget.getAttribute('data-col');
        renderSysAll();
        syncSortTabs();
      });
    }
  }
  function syncSortTabs() {
    document.querySelectorAll('[data-sort]').forEach(
      function (b) {
        b.setAttribute(
          'aria-selected',
          b.getAttribute('data-sort') === sort
            ? 'true'
            : 'false',
        );
      },
    );
  }
  function renderSystem() {
    renderSysMetrics();
    renderSysTrend();
    var entries = rankPages();
    renderMovers(
      document.getElementById('sys-regress'),
      entries,
      true,
    );
    // Most improved first (most negative Δ).
    var wins = entries.slice().filter(function (e) {
      return e.deltaMs !== null && e.deltaMs < 0;
    }).sort(function (a, b) {
      return a.deltaMs - b.deltaMs;
    });
    renderMovers(
      document.getElementById('sys-wins'),
      wins,
      false,
    );
    renderSysBudget();
    renderSysPhase();
    renderSysAll();
  }
  function metaFor(entry) {
    if (sort === 'ready') {
      return entry.readyMs === null
        ? 'n/a'
        : formatDurationPerf(entry.readyMs, false);
    }
    if (sort === 'delta') {
      return entry.deltaMs === null
        ? 'n/a'
        : formatDurationPerf(entry.deltaMs, true);
    }
    if (entry.budgetPct === null) return 'n/a';
    return Math.round(entry.budgetPct * 1000) / 10
      + '%';
  }
  function renderRank() {
    var list = document.getElementById('rank-list');
    var entries = rankPages();
    if (focused === null && entries.length) {
      focused = entries[0].page;
    }
    list.innerHTML = '';
    for (var i = 0; i < entries.length; i++) {
      var e = entries[i];
      var row = document.createElement('div');
      row.className = 'rank-row';
      row.setAttribute('role', 'option');
      row.setAttribute(
        'aria-selected',
        e.page === focused ? 'true' : 'false',
      );
      row.dataset.page = e.page;
      row.innerHTML =
        '<span>' + e.page + '</span>'
        + '<span class="rank-meta">'
        + metaFor(e) + '</span>';
      row.addEventListener('click', function (ev) {
        goPage(ev.currentTarget.dataset.page);
      });
      list.appendChild(row);
    }
  }
  function currentEntry() {
    var entries = rankPages();
    for (var i = 0; i < entries.length; i++) {
      if (entries[i].page === focused) {
        return entries[i];
      }
    }
    return entries[0] || null;
  }
  function renderPageMetrics() {
    var e = currentEntry();
    var el = document.getElementById('page-metrics');
    if (!e) {
      el.innerHTML = '';
      return;
    }
    var ready =
      e.readyMs === null
        ? 'n/a'
        : formatDurationPerf(e.readyMs, false);
    var delta =
      e.deltaMs === null
        ? 'n/a'
        : formatDurationPerf(e.deltaMs, true);
    var budget =
      e.budgetPct === null
        ? 'n/a'
        : (Math.round(e.budgetPct * 1000) / 10) + '%';
    var deltaClass = '';
    if (e.deltaMs !== null && e.deltaMs > 0) {
      deltaClass = 'delta-pos';
    } else if (e.deltaMs !== null && e.deltaMs < 0) {
      deltaClass = 'delta-neg';
    }
    el.innerHTML =
      metricCard('Page', e.page)
      + metricCard('End ready', ready)
      + metricCard('Δ start→end', delta, deltaClass)
      + metricCard('Budget', budget);
  }
  function renderTrend() {
    var body = document.getElementById('focus-body');
    var page = focused;
    var points = [];
    for (var i = startIndex; i <= endIndex; i++) {
      var p = sweeps[i].pages[page];
      if (!p) continue;
      var s = sweeps[i];
      var candle = pageCandle(p);
      var tipLines = [
        ['SHA', s.sha],
        ['Date', formatUtc(s.at)],
        ['Ready', formatDurationPerf(p.readyMs, false)],
      ];
      if (candle !== null) {
        tipLines.push(
          ['Low', formatDurationPerf(candle.min, false)],
          ['High', formatDurationPerf(candle.max, false)],
          [
            'Box',
            formatDurationPerf(candle.mean, false)
            + ' ± '
            + formatDurationPerf(candle.sigma, false),
          ],
        );
      }
      tipLines.push(['Runs', String(s.runs) + ' runs']);
      points.push({
        index: i,
        y: p.readyMs,
        candle: candle,
        tipLines: tipLines,
      });
    }
    if (!points.length) {
      body.innerHTML =
        '<p class="muted">No samples for this page '
        + 'in the window.</p>';
      return;
    }
    var budget = budgets[page]
      ? budgets[page].readyMs
      : null;
    var html = buildTrendSvg(points, {
      budgetMs: budget,
      labelIndices: trendLabelIndices(page, 8),
    });
    if (budget !== null) {
      html +=
        '<p class="muted">Dashed line = budget ceiling ('
        + formatDurationPerf(budget, false) + ').</p>';
    }
    html +=
      '<p class="muted">Gaps mean the page was absent '
      + 'from that sweep. Drag point→point to set '
      + 'window.</p>';
    html +=
      '<p class="muted">Candle: whiskers trimmed '
      + 'min–max, box mean ± 1σ, tick median. '
      + 'Sweeps without a candle predate spread '
      + 'recording.</p>';
    body.innerHTML = html;
    wireTrend(body);
  }
  function renderPhase() {
    var body = document.getElementById('focus-body');
    var to = sweeps[endIndex];
    var pageData = to.pages[focused];
    if (!pageData) {
      body.innerHTML =
        '<p class="muted">No phase data in the '
        + '<strong>end</strong> sweep for this page.</p>';
      return;
    }
    var r = rollupPhases(pageData.phases);
    var total =
      r.buckets.boot + r.buckets.fetch
      + r.buckets.render + r.buckets.other;
    function seg(name, ms, color) {
      if (ms <= 0 || total <= 0) return '';
      var pct = (ms / total) * 100;
      return '<div class="bar-seg" style="width:'
        + pct + '%;background:' + color
        + '"></div>';
    }
    var html = '';
    html += '<div class="legend">'
      + '<span><span class="swatch" style="'
      + 'background:var(--boot)"></span>boot '
      + formatDurationPerf(r.buckets.boot, false)
      + '</span>'
      + '<span><span class="swatch" style="'
      + 'background:var(--fetch)"></span>fetch '
      + formatDurationPerf(r.buckets.fetch, false)
      + '</span>'
      + '<span><span class="swatch" style="'
      + 'background:var(--render)"></span>render '
      + formatDurationPerf(r.buckets.render, false)
      + '</span>'
      + '<span><span class="swatch" style="'
      + 'background:var(--other)"></span>other '
      + formatDurationPerf(r.buckets.other, false)
      + '</span></div>';
    html += '<div class="bar-stack">'
      + seg('boot', r.buckets.boot, 'var(--boot)')
      + seg('fetch', r.buckets.fetch, 'var(--fetch)')
      + seg(
        'render', r.buckets.render, 'var(--render)',
      )
      + seg('other', r.buckets.other, 'var(--other)')
      + '</div>';
    html += '<p class="muted">'
      + 'boot:page-init is residual wall time after '
      + 'nested fetch/render (no double-count).</p>';
    html += '<div class="phase-list">';
    for (var i = 0; i < r.phases.length; i++) {
      var ph = r.phases[i];
      var label = ph.name;
      if (ph.name === MEASURE_BOOT_PAGE_INIT) {
        label = ph.name + ' (residual)';
      }
      html += '<div><span>' + label
        + ' <span class="muted">(' + ph.bucket
        + ')</span></span><span>'
        + formatDurationPerf(ph.ms, false)
        + '</span></div>';
    }
    if (!r.phases.length) {
      html += '<p class="muted">'
        + 'No phase marks recorded.</p>';
    }
    html += '</div>';
    body.innerHTML = html;
  }
  function renderBudget() {
    var body = document.getElementById('focus-body');
    var e = currentEntry();
    if (!e) {
      body.innerHTML = '';
      return;
    }
    var budget = budgets[focused]
      ? budgets[focused].readyMs
      : null;
    if (e.readyMs === null || budget === null) {
      body.innerHTML =
        '<p class="muted">Budget ratio n/a '
        + '(need median and budget for this page).</p>';
      return;
    }
    var pct = e.budgetPct;
    var pctShow = Math.round(pct * 1000) / 10;
    var headroom = budget - e.readyMs;
    var fillPct = Math.min(pct * 100, 100);
    var over = pct > 1;
    var html = '<div class="budget-block">';
    html += '<div><span>Median ready</span><span>'
      + formatDurationPerf(e.readyMs, false)
      + '</span></div>';
    html += '<div><span>Budget ceiling</span><span>'
      + formatDurationPerf(budget, false)
      + '</span></div>';
    html += '<div><span>Used</span><span>'
      + pctShow + '%</span></div>';
    html += '<div><span>Headroom</span><span>'
      + formatDurationPerf(headroom, true)
      + '</span></div>';
    html += '<div class="budget-track">'
      + '<div class="budget-fill'
      + (over ? ' over' : '')
      + '" style="width:' + fillPct
      + '%"></div></div>';
    if (over) {
      html += '<p class="delta-pos">Over budget.</p>';
    }
    html += '</div>';
    body.innerHTML = html;
  }
  function renderFocus() {
    if (mode === 'trend') renderTrend();
    else if (mode === 'phase') renderPhase();
    else renderBudget();
  }
  function renderViews() {
    var sys = document.getElementById('view-system');
    var pg = document.getElementById('view-page');
    if (view === 'system') {
      sys.className = 'view-system active';
      pg.className = 'view-page';
      renderSystem();
    } else {
      sys.className = 'view-system';
      pg.className = 'view-page active';
      renderRank();
      renderPageMetrics();
      renderFocus();
    }
  }
  function renderAll() {
    renderSummary();
    renderCrumb();
    renderViews();
  }
  document.querySelectorAll('[data-sort]').forEach(
    function (btn) {
      btn.addEventListener('click', function () {
        sort = btn.getAttribute('data-sort');
        syncSortTabs();
        if (view === 'page') {
          renderRank();
          renderPageMetrics();
        } else {
          renderSystem();
        }
      });
    },
  );
  document.querySelectorAll('[data-mode]').forEach(
    function (btn) {
      btn.addEventListener('click', function () {
        mode = btn.getAttribute('data-mode');
        document.querySelectorAll('[data-mode]')
          .forEach(function (b) {
            b.setAttribute(
              'aria-selected',
              b === btn ? 'true' : 'false',
            );
          });
        if (view === 'page') renderFocus();
      });
    },
  );
  document.getElementById('start-sel').addEventListener(
    'change',
    function (ev) {
      var v = Number(ev.target.value);
      if (v > endIndex) endIndex = v;
      startIndex = v;
      fillSelectors();
      renderAll();
    },
  );
  document.getElementById('end-sel').addEventListener(
    'change',
    function (ev) {
      var v = Number(ev.target.value);
      if (v < startIndex) startIndex = v;
      endIndex = v;
      fillSelectors();
      renderAll();
    },
  );
  document.getElementById('reset-window')
    .addEventListener('click', function () {
      startIndex = 0;
      endIndex = sweeps.length - 1;
      fillSelectors();
      renderAll();
    });
  window.addEventListener('hashchange', function () {
    readHash();
    renderAll();
  });
  fillSelectors();
  readHash();
  renderAll();
})();
</script>
</body>
</html>
